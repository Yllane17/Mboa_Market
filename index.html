<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GESTION DU CSS -->
    <link
      rel="stylesheet"
      href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- ENTETE de PAGE -->
    <header id="entete">
      <div class="container">
        <div id="logo">
          <a href="#">Mboa <span>Market</span></a>
        </div>
        <div id="menu">
          <a href="#" id="btn_panier">
            Panier <span><i class="fa-solid fa-cart-shopping"></i></span>
            <span id="nd-articles" class="hide">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- CONTENEUR DE LA PAGE -->

    <main id="conteneur">
      <!-- SECTION CARROUSEL -->
      <section id="carrousel">
        <!-- BOUTONS D'OPTIONS DU SLIDE -->
      </section>
      <!-- SECTION BOUTIQUE -->
      <section id="boutique">
        <div class="boutique-entete">
          <h2>Nos produits du Marché</h2>
          <p id="nb-resultats"></p>
        </div>

        <!-- FILTRE DE RECHERCHE DES PRODUITS -->
        <div class="boutique-outils">
          <div class="recherche">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="search"
              name="search"
              id="recherche"
              placeholder="Rechercher : poivre blanc, poulet..."
            />
          </div>
          
          <select name="tri" id="tri">
            <option value="default">Trier par : recommandés</option>
            <option value="prix-croissant">Prix croissant</option>
            <option value="prix-decroissant">Prix déroissant</option>
            <option value="nom">Nom (A-Z)</option>
          </select>
        </div>
        <!-- LISTE DES CATEGORIES -->
        <div id="categories">

        </div>
        <!-- LISTE DES PRODUITS -->
        <div id="produits"> 

        </div>
      </section>
    </main>

    <footer id="pied">
      <p>
        <b>Mboa<span>Market</span></b>
        Le gout de ça, livré chez vous.
      </p>
      <p>
        Tel: +237 652 99 70 19 | Email: yllanedave43@gmail.com
      </p>
    </footer>

    <!-- GESTION DU JAVASCRIPT -->
    <script text="text/javascript" src="js/carrousel.js"></script>
    <script text="text/javascript" src="js/script.js"></script>
  </body>
</html>
